name: Test Action

on:
  push:
    branches: [main, fix/action]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./
        with:
          site-title: "Starlight GitHub Pages Action"
          site-description: "Documentation for the Starlight GitHub Pages Action"
          content-dir: "docs"
