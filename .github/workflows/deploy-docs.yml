name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./
        with:
          site-title: "Starlight GitHub Pages Action"
          site-description: "Zero-config Starlight documentation deployment to GitHub Pages"
          content-dir: "docs"
          social: |
            - label: GitHub
              icon: github
              href: https://github.com/myerscode/starlight-github-pages-action
          sidebar: |
            - label: Getting Started
              slug: ""
            - label: Usage Guides
              items:
                - label: Setup
                  slug: guides/setup
                - label: Configuration
                  slug: guides/configuration
                - label: Examples
                  slug: guides/examples
                - label: Showcase
                  slug: guides/showcase
