name: Deploy Multi-Language Documentation

# Example workflow for deploying documentation with multiple language versions
# This example shows how to deploy different language versions to different paths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-english:
    environment:
      name: github-pages-en
      url: ${{ steps.deployment.outputs.site-url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy English Documentation
        id: deployment
        uses: myerscode/starlight-github-pages-action@v1
        with:
          site-title: "My Project Documentation"
          site-description: "Official documentation for My Project"
          content-dir: "docs/en"
          base-path: "/docs"
          logo: "assets/logo.png"
          favicon: "assets/favicon.ico"

  deploy-spanish:
    environment:
      name: github-pages-es
      url: ${{ steps.deployment.outputs.site-url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Spanish Documentation
        id: deployment
        uses: myerscode/starlight-github-pages-action@v1
        with:
          site-title: "Documentación de Mi Proyecto"
          site-description: "Documentación oficial para Mi Proyecto"
          content-dir: "docs/es"
          base-path: "/docs/es"
          logo: "assets/logo.png"
          favicon: "assets/favicon.ico"

  deploy-index:
    needs: [deploy-english, deploy-spanish]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.site-url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Language Index
        id: deployment
        uses: myerscode/starlight-github-pages-action@v1
        with:
          site-title: "My Project Documentation"
          site-description: "Choose your language / Elige tu idioma"
          content-dir: "docs/index"
          logo: "assets/logo.png"
          favicon: "assets/favicon.ico"