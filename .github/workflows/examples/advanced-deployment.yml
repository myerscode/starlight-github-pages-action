name: Deploy Documentation (Advanced)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: myerscode/starlight-github-pages-action@main
        id: deployment
        with:
          site-title: "My Project Documentation"
          site-description: "Comprehensive documentation for My Project"
          content-dir: "docs"
          logo: "assets/logo.png"
          favicon: "assets/favicon.ico"
          palette: "blue"
          # base-path is auto-detected (including custom domains) - only set it
          # if you serve the site under a subpath outside GitHub Pages
          sidebar: |
            - label: Home
              slug: ""
            - label: Guides
              items:
                - autogenerate:
                    directory: guides
            - label: API Reference
              collapsed: true
              items:
                - autogenerate:
                    directory: api
          social: |
            - label: GitHub
              icon: github
              href: https://github.com/myorg/myrepo
            - label: Discord
              icon: discord
              href: https://discord.gg/invite
          header-links: |
            - label: "[lucide:book-open] Guides"
              href: /guides/
          page-actions: |
            copy-markdown: true
            open-in-chatgpt: true
            open-in-claude: true
