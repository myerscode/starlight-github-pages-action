name: Deploy Documentation (Advanced)

# This is an advanced example workflow with custom configuration
# Copy this file to your repository's .github/workflows/ directory

on:
  # Trigger on pushes to main branch
  push:
    branches: [main]
    # Only run when documentation files change
    paths:
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/deploy-docs.yml'
  
  # Trigger on pull requests to preview changes
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
  
  # Allow manual triggering
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job to build and deploy to GitHub Pages
  deploy:
    # Only deploy on main branch (not PRs)
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: myerscode/starlight-github-pages-action@v1
        with:
          # Site configuration
          site-title: "My Project Documentation"
          site-description: "Comprehensive documentation for My Project with examples, guides, and API reference"
          
          # Content and assets
          content-dir: "documentation"
          
          # GitHub Pages configuration
          base-path: "/my-project"  # Use repository name for project pages
          
          # Custom branding
          logo: "assets/logo.png"
          favicon: "assets/favicon.ico"

      - name: Comment PR with preview info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📖 Documentation will be updated at: ${{ steps.deployment.outputs.site-url }}'
            })

  # Job to validate documentation on PRs
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate documentation
        uses: myerscode/starlight-github-pages-action@v1
        with:
          site-title: "PR Preview - My Project Documentation"
          content-dir: "documentation"
          # Note: This will build but not deploy for PRs
        env:
          # Disable actual deployment for validation
          GITHUB_PAGES_DEPLOY: false