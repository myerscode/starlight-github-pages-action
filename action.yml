name: 'Deploy Starlight to GitHub Pages'
description: 'Build and deploy Starlight documentation sites to GitHub Pages'
author: 'myerscode'

branding:
  icon: 'book-open'
  color: 'purple'

inputs:
  site-title:
    description: 'Title for the documentation site'
    required: true
  content-dir:
    description: 'Directory containing documentation content'
    required: false
    default: 'docs'
  site-description:
    description: 'Description for SEO and metadata'
    required: false
    default: 'Documentation site built with Starlight'
  base-path:
    description: 'Base path for GitHub Pages deployment'
    required: false
    default: ''
  favicon:
    description: 'Path to custom favicon file'
    required: false
    default: ''
  logo:
    description: 'Path to custom logo file'
    required: false
    default: ''

outputs:
  site-url:
    description: 'The deployed GitHub Pages URL'
    value: ${{ steps.deploy.outputs.page_url }}
  build-status:
    description: 'Success/failure status of the build process'
    value: ${{ steps.build.outputs.build-status }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Build Starlight Site
      id: build
      shell: bash
      env:
        SITE_TITLE: ${{ inputs.site-title }}
        CONTENT_DIR: ${{ inputs.content-dir }}
        SITE_DESCRIPTION: ${{ inputs.site-description }}
        BASE_PATH: ${{ inputs.base-path }}
        FAVICON: ${{ inputs.favicon }}
        LOGO: ${{ inputs.logo }}
        GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -e

        echo "🚀 Starting Starlight build process..."

        # Validate inputs
        if [ -z "$SITE_TITLE" ]; then
          echo "❌ Error: site-title is required"
          exit 1
        fi

        CONTENT_DIR="${CONTENT_DIR:-docs}"
        SITE_DESCRIPTION="${SITE_DESCRIPTION:-Documentation site built with Starlight}"
        BUILD_DIR=".starlight-build"

        echo "🔍 Configuration:"
        echo "   Site title: $SITE_TITLE"
        echo "   Content directory: $CONTENT_DIR"

        # Validate content directory exists
        if [ ! -d "$CONTENT_DIR" ]; then
          echo "❌ Error: Content directory '$CONTENT_DIR' not found"
          exit 1
        fi

        # Create build directory structure
        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR/src/content/docs"
        mkdir -p "$BUILD_DIR/public"

        # Create package.json
        cat > "$BUILD_DIR/package.json" <<'PKGJSON'
        {
          "name": "starlight-docs",
          "private": true,
          "type": "module",
          "scripts": {
            "build": "astro build"
          }
        }
        PKGJSON
        sed -i 's/^        //' "$BUILD_DIR/package.json"

        # Create content collection config (required by Astro Content Layer API)
        cat > "$BUILD_DIR/src/content.config.ts" <<'CONTENTCFG'
        import { defineCollection } from 'astro:content';
        import { docsLoader } from '@astrojs/starlight/loaders';
        import { docsSchema } from '@astrojs/starlight/schema';

        export const collections = {
          docs: defineCollection({ loader: docsLoader(), schema: docsSchema() }),
        };
        CONTENTCFG
        sed -i 's/^        //' "$BUILD_DIR/src/content.config.ts"

        cd "$BUILD_DIR"

        # Install dependencies
        echo "📦 Installing dependencies..."
        npm install astro @astrojs/starlight sharp

        # Copy user content into src/content/docs
        echo "📝 Processing content..."
        find "../$CONTENT_DIR" \( -name "*.md" -o -name "*.mdx" \) | while read -r file; do
          rel_path=$(realpath --relative-to="../$CONTENT_DIR" "$file")
          target_dir="src/content/docs/$(dirname "$rel_path")"
          mkdir -p "$target_dir"
          cp "$file" "$target_dir/"
        done

        # Copy non-markdown assets to public/assets
        if find "../$CONTENT_DIR" -type f ! \( -name "*.md" -o -name "*.mdx" \) | grep -q .; then
          find "../$CONTENT_DIR" -type f ! \( -name "*.md" -o -name "*.mdx" \) | while read -r file; do
            rel_path=$(realpath --relative-to="../$CONTENT_DIR" "$file")
            target_dir="public/assets/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            cp "$file" "$target_dir/"
          done
        fi

        echo "   ✓ Content copied"

        # Handle logo
        LOGO_CONFIG=""
        if [ -n "$LOGO" ] && [ -f "../$LOGO" ]; then
          mkdir -p src/assets
          cp "../$LOGO" src/assets/
          logo_filename=$(basename "$LOGO")
          LOGO_CONFIG="logo: { src: './src/assets/$logo_filename' },"
          echo "   ✓ Logo copied: $LOGO"
        fi

        # Handle favicon
        FAVICON_CONFIG=""
        if [ -n "$FAVICON" ] && [ -f "../$FAVICON" ]; then
          cp "../$FAVICON" public/
          favicon_filename=$(basename "$FAVICON")
          FAVICON_CONFIG="favicon: '/$favicon_filename',"
          echo "   ✓ Favicon copied: $FAVICON"
        fi

        # Build astro config
        echo "⚙️  Generating Astro configuration..."

        SITE_CONFIG=""
        if [ -n "$GITHUB_REPO_URL" ]; then
          SITE_CONFIG="site: '$GITHUB_REPO_URL',"
        fi

        BASE_CONFIG=""
        if [ -n "$BASE_PATH" ]; then
          BASE_CONFIG="base: '$BASE_PATH',"
        fi

        SOCIAL_CONFIG=""
        if [ -n "$GITHUB_REPO_URL" ]; then
          SOCIAL_CONFIG="social: [{ label: 'GitHub', icon: 'github', href: '$GITHUB_REPO_URL' }],"
        fi

        cat > astro.config.mjs <<ASTROCFG
        import { defineConfig } from 'astro/config';
        import starlight from '@astrojs/starlight';

        export default defineConfig({
          $SITE_CONFIG
          $BASE_CONFIG
          integrations: [
            starlight({
              title: '$SITE_TITLE',
              description: '$SITE_DESCRIPTION',
              $LOGO_CONFIG
              $FAVICON_CONFIG
              $SOCIAL_CONFIG
            }),
          ],
        });
        ASTROCFG
        sed -i 's/^        //' astro.config.mjs

        echo "   ✓ Configuration generated"
        cat astro.config.mjs

        # Build the site
        echo "🔨 Building Starlight site..."
        npm run build

        # Validate build output
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Error: Build failed - no index.html found in dist/"
          echo "   Contents of dist/:"
          ls -la dist/ 2>/dev/null || echo "   dist/ directory does not exist"
          exit 1
        fi

        echo "✅ Build completed successfully!"
        echo "build-status=success" >> $GITHUB_OUTPUT

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: .starlight-build/dist

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5
