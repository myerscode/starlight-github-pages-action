name: 'Deploy Starlight to GitHub Pages'
description: 'Build and deploy Starlight documentation sites to GitHub Pages'
author: 'myerscode'

branding:
  icon: 'book-open'
  color: 'purple'

inputs:
  site-title:
    description: 'Title for the documentation site'
    required: true
  content-dir:
    description: 'Directory containing documentation content'
    required: false
    default: 'docs'
  site-description:
    description: 'Description for SEO and metadata'
    required: false
    default: 'Documentation site built with Starlight'
  base-path:
    description: 'Base path for GitHub Pages deployment (auto-detected if not set)'
    required: false
    default: ''
  favicon:
    description: 'Path to custom favicon file'
    required: false
    default: ''
  logo:
    description: 'Path to custom logo file'
    required: false
    default: ''
  changelog:
    description: 'Include changelog in docs. Set to "false" to disable, or a path to a specific file. Defaults to auto-detecting CHANGELOG.md from repo root.'
    required: false
    default: 'auto'
  sidebar:
    description: 'JSON array defining the sidebar structure. If not set, sidebar is auto-generated from content directory.'
    required: false
    default: ''
  social:
    description: 'JSON array of social links, e.g. [{"label":"GitHub","icon":"github","href":"https://github.com/org/repo"}]'
    required: false
    default: ''

outputs:
  site-url:
    description: 'The deployed GitHub Pages URL'
    value: ${{ steps.deploy.outputs.page_url }}
  build-status:
    description: 'Success/failure status of the build process'
    value: ${{ steps.build.outputs.build-status }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    - name: Build Starlight Site
      id: build
      shell: bash
      env:
        SITE_TITLE: ${{ inputs.site-title }}
        CONTENT_DIR: ${{ inputs.content-dir }}
        SITE_DESCRIPTION: ${{ inputs.site-description }}
        BASE_PATH: ${{ inputs.base-path }}
        FAVICON: ${{ inputs.favicon }}
        LOGO: ${{ inputs.logo }}
        CHANGELOG: ${{ inputs.changelog }}
        SIDEBAR: ${{ inputs.sidebar }}
        SOCIAL: ${{ inputs.social }}
        GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -e

        echo "🚀 Starting Starlight build process..."

        # Validate inputs
        if [ -z "$SITE_TITLE" ]; then
          echo "❌ Error: site-title is required"
          exit 1
        fi

        CONTENT_DIR="${CONTENT_DIR:-docs}"
        SITE_DESCRIPTION="${SITE_DESCRIPTION:-Documentation site built with Starlight}"
        BUILD_DIR=".starlight-build"

        # Use configure-pages output for base path if not explicitly set
        if [ -z "$BASE_PATH" ]; then
          BASE_PATH="$PAGES_BASE_PATH"
        fi

        echo "🔍 Configuration:"
        echo "   Site title: $SITE_TITLE"
        echo "   Content directory: $CONTENT_DIR"
        echo "   Base URL: $PAGES_BASE_URL"
        echo "   Base path: $BASE_PATH"

        # Validate content directory exists
        if [ ! -d "$CONTENT_DIR" ]; then
          echo "❌ Error: Content directory '$CONTENT_DIR' not found"
          exit 1
        fi

        # Scaffold build directory from template
        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR/src/content/docs"
        mkdir -p "$BUILD_DIR/public"

        cp "$ACTION_PATH/template/package.json" "$BUILD_DIR/package.json"
        cp "$ACTION_PATH/template/src/content.config.ts" "$BUILD_DIR/src/content.config.ts"

        cd "$BUILD_DIR"

        # Install dependencies
        echo "📦 Installing dependencies..."
        npm install

        # Copy user content into src/content/docs
        echo "📝 Processing content..."
        find "../$CONTENT_DIR" \( -name "*.md" -o -name "*.mdx" \) | while read -r file; do
          rel_path=$(realpath --relative-to="../$CONTENT_DIR" "$file")
          target_dir="src/content/docs/$(dirname "$rel_path")"
          mkdir -p "$target_dir"
          cp "$file" "$target_dir/"
        done

        # Copy non-markdown assets to public/assets
        if find "../$CONTENT_DIR" -type f ! \( -name "*.md" -o -name "*.mdx" \) | grep -q .; then
          find "../$CONTENT_DIR" -type f ! \( -name "*.md" -o -name "*.mdx" \) | while read -r file; do
            rel_path=$(realpath --relative-to="../$CONTENT_DIR" "$file")
            target_dir="public/assets/$(dirname "$rel_path")"
            mkdir -p "$target_dir"
            cp "$file" "$target_dir/"
          done
        fi

        echo "   ✓ Content copied"

        # Handle changelog
        if [ "$CHANGELOG" != "false" ]; then
          # Check if user already has a changelog in their content dir (takes precedence)
          if find "src/content/docs" -maxdepth 1 -iname "changelog*" | grep -qi .; then
            echo "   ✓ Changelog found in content directory (using existing)"
          else
            CHANGELOG_SOURCE=""

            if [ "$CHANGELOG" = "auto" ]; then
              # Auto-detect: look for common changelog filenames in repo root
              for name in CHANGELOG.md changelog.md CHANGELOG CHANGELOG.txt; do
                if [ -f "../$name" ]; then
                  CHANGELOG_SOURCE="../$name"
                  break
                fi
              done
            elif [ -f "../$CHANGELOG" ]; then
              # User specified a path
              CHANGELOG_SOURCE="../$CHANGELOG"
            fi

            if [ -n "$CHANGELOG_SOURCE" ]; then
              # Copy and ensure it has proper frontmatter
              if head -1 "$CHANGELOG_SOURCE" | grep -q "^---"; then
                cp "$CHANGELOG_SOURCE" "src/content/docs/changelog.md"
              else
                # Add frontmatter wrapper
                {
                  echo "---"
                  echo "title: Changelog"
                  echo "description: Version history and release notes"
                  echo "---"
                  echo ""
                  cat "$CHANGELOG_SOURCE"
                } > "src/content/docs/changelog.md"
              fi
              echo "   ✓ Changelog copied from $(basename "$CHANGELOG_SOURCE")"
            fi
          fi
        fi

        # Handle logo
        LOGO_CONFIG=""
        if [ -n "$LOGO" ] && [ -f "../$LOGO" ]; then
          mkdir -p src/assets
          cp "../$LOGO" src/assets/
          logo_filename=$(basename "$LOGO")
          LOGO_CONFIG="logo: { src: './src/assets/$logo_filename' },"
          echo "   ✓ Logo copied: $LOGO"
        else
          # Auto-detect logos in content directory and copy to public root
          for name in logo-dark.svg logo-light.svg logo.svg; do
            if [ -f "../$CONTENT_DIR/$name" ]; then
              cp "../$CONTENT_DIR/$name" public/
              echo "   ✓ Logo auto-detected: $name"
            fi
          done
        fi

        # Handle favicon
        FAVICON_CONFIG=""
        if [ -n "$FAVICON" ] && [ -f "../$FAVICON" ]; then
          cp "../$FAVICON" public/
          favicon_filename=$(basename "$FAVICON")
          FAVICON_CONFIG="favicon: '/$favicon_filename',"
          echo "   ✓ Favicon copied: $FAVICON"
        else
          # Auto-detect favicon in content directory
          for name in favicon.svg favicon.ico favicon.png; do
            if [ -f "../$CONTENT_DIR/$name" ]; then
              cp "../$CONTENT_DIR/$name" public/
              FAVICON_CONFIG="favicon: '/$name',"
              echo "   ✓ Favicon auto-detected: $name"
              break
            fi
          done
        fi

        # Astro configuration
        SITE_URL="${PAGES_BASE_URL:-$GITHUB_REPO_URL}"

        # Always copy the bundled theme from the action
        cp -r "$ACTION_PATH/theme" ./theme
        echo "   ✓ Theme copied"

        # Copy theme assets to public
        if [ -d "./theme/assets" ]; then
          cp ./theme/assets/404.svg public/_404.svg 2>/dev/null || true
          echo "   ✓ Theme assets copied to public"
        fi

        if [ -f "../astro.config.mjs" ]; then
          # Consumer provides their own config — use it
          echo "⚙️  Using astro.config.mjs from repository..."
          cp "../astro.config.mjs" astro.config.mjs
          echo "   ✓ User config copied"
        else
          # Use the default template from the action, configured via env vars
          echo "⚙️  Using default config template..."
          cp "$ACTION_PATH/astro.config.mjs" astro.config.mjs
          echo "   ✓ Default config copied"
        fi

        # Set env vars that the config template reads
        export STARLIGHT_SITE="$SITE_URL"
        export STARLIGHT_BASE="$BASE_PATH"
        export STARLIGHT_TITLE="$SITE_TITLE"
        export STARLIGHT_DESCRIPTION="$SITE_DESCRIPTION"

        if [ -n "$FAVICON" ]; then
          export STARLIGHT_FAVICON="/$(basename "$FAVICON")"
        else
          # Check if auto-detected favicon was copied
          for name in favicon.svg favicon.ico favicon.png; do
            if [ -f "public/$name" ]; then
              export STARLIGHT_FAVICON="/$name"
              break
            fi
          done
        fi

        if [ -n "$SIDEBAR" ]; then
          # Detect if input is JSON (starts with [) or YAML
          if echo "$SIDEBAR" | grep -q '^\s*\['; then
            export STARLIGHT_SIDEBAR="$SIDEBAR"
          else
            export STARLIGHT_SIDEBAR=$(echo "$SIDEBAR" | yq -o=json '.')
          fi
        fi

        # Social: use input if provided, otherwise default to GitHub link
        if [ -n "$SOCIAL" ]; then
          if echo "$SOCIAL" | grep -q '^\s*\['; then
            export STARLIGHT_SOCIAL="$SOCIAL"
          else
            export STARLIGHT_SOCIAL=$(echo "$SOCIAL" | yq -o=json '.')
          fi
        elif [ -n "$GITHUB_REPO_URL" ]; then
          export STARLIGHT_SOCIAL="[{\"label\":\"GitHub\",\"icon\":\"github\",\"href\":\"$GITHUB_REPO_URL\"}]"
        fi

        cat astro.config.mjs

        # Build the site
        echo "🔨 Building Starlight site..."
        npm run build

        # Validate build output
        if [ ! -f "dist/index.html" ]; then
          echo "❌ Error: Build failed - no index.html found in dist/"
          ls -la dist/ 2>/dev/null || echo "   dist/ directory does not exist"
          exit 1
        fi

        echo "✅ Build completed successfully!"
        echo "build-status=success" >> $GITHUB_OUTPUT

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: .starlight-build/dist

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5
